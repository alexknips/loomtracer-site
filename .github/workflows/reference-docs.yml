name: Reference docs in sync

# The docs live here; the code they describe lives in alexknips/loomtracer.
# The site documents the LATEST hivemind RELEASE, not master: master's new
# flags and tools would advertise what nobody can install yet. This resolves
# the latest release tag, builds hivemind's own generator at that tag and runs
# its --check against this repo's website/ (the generator reads website/...
# relative to its working directory). It fails if reference/mcp-tools.md,
# reference/cli.md, guides/mcp-setup.md or the homepage drift from that
# release.
#
# regenerate-reference.yml rewrites the generated parts from the same tag. The
# hand-written parts (reference/cli.md, the "Available tools" table in
# guides/mcp-setup.md) are updated by hand at release time, so after a release
# that adds a tool this stays red on main until that row is written: that red
# is the alarm.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-docs:
    name: Reference docs match the latest hivemind release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          path: site

      - name: Resolve the latest hivemind release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/alexknips/loomtracer/releases/latest --jq .tag_name)
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "hivemind latest release: $tag"

      - name: Check out hivemind at that release
        uses: actions/checkout@v4
        with:
          repository: alexknips/loomtracer
          ref: ${{ steps.release.outputs.tag }}
          path: hivemind

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hivemind
          shared-key: hivemind-generate-reference

      - name: Record the hivemind commit checked against
        working-directory: hivemind
        run: git log -1 --format='hivemind ${{ steps.release.outputs.tag }} %H %s'

      - name: Check the docs against the code
        working-directory: site
        run: cargo run --locked --manifest-path ../hivemind/Cargo.toml --bin generate-reference -- --check
