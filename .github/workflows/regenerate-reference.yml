name: Regenerate reference docs

# The generated parts of the reference (reference/mcp-tools.md, and the digits
# of the "N tools" mentions in guides/mcp-setup.md and the homepage) come from
# hivemind's own generate-reference binary. This regenerates them from the
# LATEST hivemind RELEASE (the site documents what people can install, not
# master), commits what changed to main, then runs the "Reference docs in
# sync" check on the new main. Vercel deploys the push itself.
#
# It never touches the hand-written parts: reference/cli.md and the
# "Available tools" table in guides/mcp-setup.md are written by hand at
# release time. .github/scripts/commit-generated-reference.sh refuses to
# commit anything else.
#
# A release in alexknips/loomtracer cannot trigger a workflow here without a
# cross-repo token, so this polls every six hours. Right after a release, run
# it by hand: Actions -> "Regenerate reference docs" -> Run workflow.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # commit the regenerated files to main
  actions: write    # a GITHUB_TOKEN push triggers no workflow, so run the check explicitly

concurrency:
  group: regenerate-reference
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate from the latest hivemind release
    # Only main is ever regenerated; a dispatch from another branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          path: site

      - name: Resolve the latest hivemind release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/alexknips/loomtracer/releases/latest --jq .tag_name)
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "hivemind latest release: $tag"

      - name: Check out hivemind at that release
        uses: actions/checkout@v4
        with:
          repository: alexknips/loomtracer
          ref: ${{ steps.release.outputs.tag }}
          path: hivemind

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hivemind
          shared-key: hivemind-generate-reference

      - name: Record the hivemind commit generated from
        working-directory: hivemind
        run: git log -1 --format='hivemind ${{ steps.release.outputs.tag }} %H %s'

      - name: Regenerate the reference
        working-directory: site
        run: cargo run --locked --manifest-path ../hivemind/Cargo.toml --bin generate-reference

      - name: Commit the generated files, and nothing else
        id: commit
        working-directory: site
        run: .github/scripts/commit-generated-reference.sh "${{ steps.release.outputs.tag }}"

      - name: Push to main
        if: steps.commit.outputs.committed == 'true'
        working-directory: site
        run: |
          git pull --rebase origin main
          git push origin HEAD:main

      # Vercel's GitHub app deploys pushes to main, so there is no deploy step
      # here; only the check needs running by hand.
      - name: Re-run the sync check on the new main
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run reference-docs.yml --ref main -R "$GITHUB_REPOSITORY"
